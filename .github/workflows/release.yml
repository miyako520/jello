name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      archive_version: ${{ steps.metadata.outputs.archive_version }}
    steps:
      - uses: actions/checkout@v7
      - name: Install stable Rust
        run: |
          rustup update stable
          rustup default stable
          rustup component add rustfmt clippy
      - name: Check with the declared MSRV (1.85)
        run: |
          rustup toolchain install 1.85.0 --profile minimal
          cargo +1.85.0 check --locked --all-targets --all-features
      - name: Read and verify Cargo version
        id: metadata
        shell: bash
        run: |
          version="$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json, sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
          gui_version="$(cargo metadata --manifest-path crates/jello-gui/Cargo.toml --no-deps --format-version 1 \
            | python3 -c 'import json, sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          archive_version="${version}"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            archive_version="${version}-dev-${GITHUB_SHA::7}"
          fi
          echo "archive_version=${archive_version}" >> "${GITHUB_OUTPUT}"
          if [[ "${gui_version}" != "${version}" ]]; then
            echo "GUI version ${gui_version} does not match core version ${version}" >&2
            exit 1
          fi
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            test "v${version}" = "${GITHUB_REF_NAME}"
          fi
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Run tests
        run: cargo test --all-targets --all-features --locked
      - name: Verify Cargo package
        run: cargo package --locked

  linux:
    needs: verify
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.verify.outputs.archive_version }}
    steps:
      - uses: actions/checkout@v7
      - name: Install stable Rust
        run: |
          rustup update stable
          rustup default stable
      - name: Build Linux binary
        shell: bash
        run: |
          rustup target add x86_64-unknown-linux-gnu
          cargo build --release --locked --target x86_64-unknown-linux-gnu --features schema
          ./target/x86_64-unknown-linux-gnu/release/jello --version
      - name: Package Linux archive
        shell: bash
        run: |
          package="jello-${VERSION}-x86_64-unknown-linux-gnu"
          mkdir "${package}"
          cp target/x86_64-unknown-linux-gnu/release/jello README.md LICENSE CHANGELOG.md "${package}/"
          tar -czf "${package}.tar.gz" "${package}"
      - uses: actions/upload-artifact@v7
        with:
          name: release-linux
          path: jello-*.tar.gz
          if-no-files-found: error

  windows:
    needs: verify
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.verify.outputs.archive_version }}
    steps:
      - uses: actions/checkout@v7
      - name: Install stable Rust
        shell: pwsh
        run: |
          rustup update stable
          rustup default stable
          rustup component add rustfmt clippy
      - name: Check GUI formatting
        run: cargo fmt --manifest-path crates/jello-gui/Cargo.toml --all --check
      - name: Run GUI Clippy
        run: cargo clippy --manifest-path crates/jello-gui/Cargo.toml --all-targets --locked -- -D warnings
      - name: Run GUI tests
        run: cargo test --manifest-path crates/jello-gui/Cargo.toml --all-targets --locked
      - name: Build Windows binary
        shell: pwsh
        run: |
          rustup target add x86_64-pc-windows-msvc
          cargo build --release --locked --target x86_64-pc-windows-msvc --features "windows-drop schema"
          cargo build --manifest-path crates/jello-gui/Cargo.toml --release --locked --target x86_64-pc-windows-msvc
          ./target/x86_64-pc-windows-msvc/release/jello.exe --version
          if (-not (Test-Path ./target/x86_64-pc-windows-msvc/release/jello-drop.exe)) {
            throw "jello-drop.exe was not built"
          }
          if (-not (Test-Path ./crates/jello-gui/target/x86_64-pc-windows-msvc/release/jello-gui.exe)) {
            throw "jello-gui.exe was not built"
          }
      - name: Package Windows archive
        shell: pwsh
        run: |
          $package = "jello-$env:VERSION-x86_64-pc-windows-msvc"
          New-Item -ItemType Directory -Path $package
          Copy-Item target/x86_64-pc-windows-msvc/release/jello.exe, target/x86_64-pc-windows-msvc/release/jello-drop.exe, README.md, LICENSE, CHANGELOG.md -Destination $package
          Copy-Item crates/jello-gui/assets/NotoSansCJK-LICENSE.txt -Destination $package
          Copy-Item crates/jello-gui/target/x86_64-pc-windows-msvc/release/jello-gui.exe -Destination $package
          Compress-Archive -Path $package -DestinationPath "$package.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: release-windows
          path: jello-*.zip
          if-no-files-found: error

  macos:
    needs: verify
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.verify.outputs.archive_version }}
    steps:
      - uses: actions/checkout@v7
      - name: Install stable Rust
        run: |
          rustup update stable
          rustup default stable
      - name: Build macOS binaries
        shell: bash
        run: |
          rustup target add x86_64-apple-darwin aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin --features schema
          cargo build --release --locked --target aarch64-apple-darwin --features schema
      - name: Package universal macOS archive
        shell: bash
        run: |
          package="jello-${VERSION}-universal-apple-darwin"
          mkdir "${package}"
          lipo -create \
            target/x86_64-apple-darwin/release/jello \
            target/aarch64-apple-darwin/release/jello \
            -output "${package}/jello"
          chmod +x "${package}/jello"
          "${package}/jello" --version
          cp README.md LICENSE CHANGELOG.md "${package}/"
          tar -czf "${package}.tar.gz" "${package}"
      - uses: actions/upload-artifact@v7
        with:
          name: release-macos
          path: jello-*.tar.gz
          if-no-files-found: error

  publish:
    if: github.event_name == 'push'
    needs:
      - linux
      - windows
      - macos
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Generate checksums
        shell: bash
        run: |
          cd dist
          sha256sum *.tar.gz *.zip > SHA256SUMS
      - name: Generate public release notes
        shell: bash
        run: |
          export VERSION="${GITHUB_REF_NAME#v}"
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          version = re.escape(os.environ["VERSION"])
          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          match = re.search(
              rf"^## \[{version}\][^\n]*\n(.*?)(?=^## \[|^\[Unreleased\]:|\Z)",
              changelog,
              flags=re.MULTILINE | re.DOTALL,
          )
          if match is None:
              raise SystemExit(f"missing CHANGELOG section for {os.environ['VERSION']}")
          Path(os.environ["RUNNER_TEMP"], "release-notes.md").write_text(
              match.group(1).strip() + "\n",
              encoding="utf-8",
          )
          PY
      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          prerelease=()
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            prerelease+=(--prerelease)
          fi
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --verify-tag \
            --notes-file "${RUNNER_TEMP}/release-notes.md" \
            --title "${GITHUB_REF_NAME}" \
            "${prerelease[@]}"
