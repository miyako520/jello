name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install stable Rust
        run: |
          rustup update stable
          rustup default stable
          rustup component add rustfmt clippy
      - name: Verify tag matches Cargo version
        shell: bash
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json, sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
          test "v${version}" = "${GITHUB_REF_NAME}"
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Run tests
        run: cargo test --all-targets --locked

  linux:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install stable Rust
        run: |
          rustup update stable
          rustup default stable
      - name: Build Linux binary
        shell: bash
        run: |
          rustup target add x86_64-unknown-linux-gnu
          cargo build --release --locked --target x86_64-unknown-linux-gnu
      - name: Package Linux archive
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          package="jqr-${version}-x86_64-unknown-linux-gnu"
          mkdir "${package}"
          cp target/x86_64-unknown-linux-gnu/release/jqr README.md LICENSE CHANGELOG.md "${package}/"
          tar -czf "${package}.tar.gz" "${package}"
      - uses: actions/upload-artifact@v7
        with:
          name: release-linux
          path: jqr-*.tar.gz
          if-no-files-found: error

  windows:
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install stable Rust
        shell: pwsh
        run: |
          rustup update stable
          rustup default stable
      - name: Build Windows binary
        shell: pwsh
        run: |
          rustup target add x86_64-pc-windows-msvc
          cargo build --release --locked --target x86_64-pc-windows-msvc
      - name: Package Windows archive
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $package = "jqr-$version-x86_64-pc-windows-msvc"
          New-Item -ItemType Directory -Path $package
          Copy-Item target/x86_64-pc-windows-msvc/release/jqr.exe, README.md, LICENSE, CHANGELOG.md -Destination $package
          Compress-Archive -Path $package -DestinationPath "$package.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: release-windows
          path: jqr-*.zip
          if-no-files-found: error

  macos:
    needs: verify
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install stable Rust
        run: |
          rustup update stable
          rustup default stable
      - name: Build macOS binaries
        shell: bash
        run: |
          rustup target add x86_64-apple-darwin aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
          cargo build --release --locked --target aarch64-apple-darwin
      - name: Package universal macOS archive
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          package="jqr-${version}-universal-apple-darwin"
          mkdir "${package}"
          lipo -create \
            target/x86_64-apple-darwin/release/jqr \
            target/aarch64-apple-darwin/release/jqr \
            -output "${package}/jqr"
          chmod +x "${package}/jqr"
          cp README.md LICENSE CHANGELOG.md "${package}/"
          tar -czf "${package}.tar.gz" "${package}"
      - uses: actions/upload-artifact@v7
        with:
          name: release-macos
          path: jqr-*.tar.gz
          if-no-files-found: error

  publish:
    needs:
      - linux
      - windows
      - macos
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Generate checksums
        shell: bash
        run: |
          cd dist
          sha256sum *.tar.gz *.zip > SHA256SUMS
      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          prerelease=()
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            prerelease+=(--prerelease)
          fi
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --verify-tag \
            --generate-notes \
            --title "${GITHUB_REF_NAME}" \
            "${prerelease[@]}"
