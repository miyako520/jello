name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stable:
    name: stable / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install stable Rust
        run: |
          rustup update stable
          rustup default stable
          rustup component add rustfmt clippy
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Run tests
        run: cargo test --all-targets --all-features --locked
      - name: Build release binary
        run: cargo build --release --all-features --locked

  msrv:
    name: Rust 1.85.0
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install minimum supported Rust
        run: rustup toolchain install 1.85.0 --profile minimal
      - name: Check minimum supported Rust
        run: cargo +1.85.0 check --all-targets --all-features --locked

  windows-gui:
    name: Windows desktop GUI
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install stable Rust
        run: |
          rustup update stable
          rustup default stable
          rustup component add rustfmt clippy
      - name: Check GUI minimum supported Rust
        run: |
          rustup toolchain install 1.92.0 --profile minimal
          cargo +1.92.0 check --manifest-path crates/jello-gui/Cargo.toml --all-targets --locked
      - name: Check GUI formatting
        run: cargo fmt --manifest-path crates/jello-gui/Cargo.toml --all --check
      - name: Run GUI Clippy
        run: cargo clippy --manifest-path crates/jello-gui/Cargo.toml --all-targets --locked -- -D warnings
      - name: Run GUI tests
        run: cargo test --manifest-path crates/jello-gui/Cargo.toml --all-targets --locked
      - name: Build GUI release binary
        run: cargo build --manifest-path crates/jello-gui/Cargo.toml --release --locked


  package-smoke:
    name: package and binary smoke test
    needs:
      - stable
      - msrv
      - windows-gui
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install stable Rust
        run: |
          rustup update stable
          rustup default stable
      - name: Verify Cargo package
        run: cargo package --locked
      - name: Build release binary
        run: cargo build --release --locked
      - name: Smoke test executable
        shell: bash
        run: |
          ./target/release/jello --version
          printf '%s' '{"name":"Ada","items":[1,true,null]}' \
            | ./target/release/jello --compact \
            | grep -Fx '{"name":"Ada","items":[1,true,null]}'
          printf '%s\n' '{"ready":true}' > smoke.json
          ./target/release/jello --check --compact smoke.json
