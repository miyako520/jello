[package]
name = "jello-gui"
version = "0.2.3"
edition = "2024"
rust-version = "1.92"
publish = false
description = "Windows-first desktop interface for Jello."
license = "MIT"
repository = "https://github.com/miyako520/jello"

[dependencies]
arboard = "3"
eframe = { version = "0.35.0", default-features = false, features = ["accesskit", "default_fonts", "glow"] }
jello = { path = "../..", features = ["schema"] }
rfd = "0.17.2"

[dev-dependencies]
skrifa = "0.42.1"

[lib]
name = "jello_gui"
path = "src/lib.rs"

[[bin]]
name = "jello-gui"
path = "src/main.rs"
