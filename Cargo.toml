[package]
name = "jqr"
version = "0.1.0"
edition = "2021"
rust-version = "1.73"
description = "A small handwritten JSON formatter, fixer, and reporter."
license = "MIT"
readme = "README.md"
repository = "https://github.com/miyako520/jello"
homepage = "https://github.com/miyako520/jello"
keywords = ["json", "json5", "formatter", "repair", "cli"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["/.github/"]

[lib]
name = "jqr"
path = "src/lib.rs"

[[bin]]
name = "jqr"
path = "src/main.rs"
