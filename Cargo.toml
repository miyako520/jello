[package]
name = "jello"
version = "0.2.2"
edition = "2021"
rust-version = "1.85"
description = "A handwritten JSON formatter, validator, and conservative repair CLI."
license = "MIT"
readme = "README.md"
repository = "https://github.com/miyako520/jello"
homepage = "https://github.com/miyako520/jello"
keywords = ["json", "json5", "formatter", "repair", "cli"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["/.github/", "/crates/jello-gui/", "/fuzz/", "/test jello/"]

[lib]
name = "jello"
path = "src/lib.rs"

[features]
windows-drop = []
schema = ["dep:jsonschema", "dep:serde_json", "dep:url"]

[dependencies]
jsonschema = { version = "0.49.2", optional = true, default-features = false }
serde_json = { version = "1.0", optional = true }
url = { version = "2.5", optional = true }

[dev-dependencies]
proptest = "1.5"

[[bin]]
name = "jello"
path = "src/main.rs"

[[bin]]
name = "jello-drop"
path = "src/drop_main.rs"
required-features = ["windows-drop"]
